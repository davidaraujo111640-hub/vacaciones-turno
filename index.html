<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: toolbar de compañeros arriba, calendario mensual del cuadrante, panel lateral con resumen e historial */
:root{
  --bg:#f4f5f8;--panel:#ffffff;--fg:#0e1b33;--muted:#6b7385;--line:#e3e6ec;
  --tarde:#b4561b;--tarde-bg:#fce9d9;--manana:#1f4e8c;--manana-bg:#dde7f6;--libre-bg:#eef0f4;
  --accent:#0e1b33;--on-accent:#ffffff;--gold:#c9a13b;--hd:#0e1b33;--hd-fg:#ffffff;
  --ok:#1f7a3f;--danger:#b2392f;--shadow:0 1px 2px rgba(14,27,51,.06),0 4px 14px rgba(14,27,51,.06);
  --display:"Barlow Semi Condensed",system-ui,sans-serif;--body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--panel:#1c1f24;--fg:#e9ecef;--muted:#8a919b;--line:#2a2e35;
  --tarde:#f2a93b;--tarde-bg:#3a2a16;--manana:#6cb2f0;--manana-bg:#16283d;--libre-bg:#1a1d21;
  --accent:#c9a13b;--on-accent:#121417;--gold:#c9a13b;--hd:#0b1222;--hd-fg:#e9ecef;
  --ok:#6ccf8c;--danger:#ef7a6f;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417;--panel:#1c1f24;--fg:#e9ecef;--muted:#8a919b;--line:#2a2e35;
  --tarde:#f2a93b;--tarde-bg:#3a2a16;--manana:#6cb2f0;--manana-bg:#16283d;--libre-bg:#1a1d21;
  --accent:#c9a13b;--on-accent:#121417;--gold:#c9a13b;--hd:#0b1222;--hd-fg:#e9ecef;
  --ok:#6ccf8c;--danger:#ef7a6f;--shadow:none;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.9rem;letter-spacing:.06em}h2{font-size:1.1rem}
.sub{color:var(--muted);margin:4px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form.add{display:flex;gap:6px}
select{font:inherit;font-size:1rem;font-weight:500;padding:9px 12px;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);background:var(--panel);color:var(--fg);min-width:0;max-width:100%}
input{font:inherit;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);min-width:0;width:150px}
.btn{font:inherit;border:0;border-radius:8px;padding:7px 12px;background:var(--accent);color:var(--on-accent);cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:16px;min-width:0}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:68px;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}.tagline{color:var(--gold);font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--hd);color:var(--hd-fg);border-radius:16px;padding:14px 18px;border-bottom:3px solid var(--gold)}
.top{flex-wrap:nowrap}
@media (max-width:600px){.top{padding:12px 14px}.brand img{height:54px}h1{font-size:1.6rem}.top .btn.ghost{padding:6px 10px}.top .tl{display:none}.count .cl{display:none}.count{padding:0 5px;white-space:nowrap}}
.top .btn.ghost{color:var(--hd-fg);border-color:rgba(255,255,255,.25)}
.top h1{color:var(--hd-fg)}
#cal{touch-action:pan-y}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.calhead h2{text-transform:capitalize;font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.day{min-height:84px;border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:3px;border:1.5px solid transparent;background:var(--libre-bg);text-align:left;font:inherit;color:inherit;cursor:default;min-width:0}
.day.T{background:var(--tarde-bg)}.day.M{background:var(--manana-bg)}
.day.T,.day.M{cursor:pointer}
.day.T:hover,.day.M:hover{border-color:var(--accent)}
.day.empty{background:transparent}
.day.today{border-color:var(--fg)}
.dn{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.dn{min-width:0;overflow:hidden;gap:4px}
.sh .short{display:none}
@media (max-width:600px){
  .dn{flex-direction:column;align-items:flex-start;gap:0}
  .sh .long{display:none}.sh .short{display:inline;font-size:.72rem}
  .day{padding:4px 3px}
  .grid{gap:3px}
}
.sh{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.T .sh{color:var(--tarde)}.M .sh{color:var(--manana)}.L .sh{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:2px}
.tag{font-size:.68rem;padding:1px 5px;border-radius:4px;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag[data-l]:not([data-l=""]){background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.28) 4px 8px)}
.tag[data-l]:not([data-l=""])::after{content:" · " attr(data-l);font-weight:700}
.tag.pend{outline:2px dashed var(--fg);outline-offset:-2px;opacity:.75}
.tag.gone{text-decoration:line-through;opacity:.45}
.day.haspend{border-color:var(--fg);border-style:dashed}
.confirm{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.12);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.confirm .btn{font-size:1rem;padding:10px 18px}
body.pending .wrap{padding-bottom:110px}
.toast{z-index:6}
.count{align-self:flex-start;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 6px;font-weight:600;font-size:.68rem;margin-top:auto}
.x-count{font-size:.7rem;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.side{display:grid;gap:18px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);gap:8px}
.stat:last-child{border-bottom:0}
.stat b{font-variant-numeric:tabular-nums}
.list{max-height:320px;overflow:auto;display:grid;gap:6px;font-size:.88rem}
.tag.ok{box-shadow:0 0 0 2px var(--ok);font-weight:700}
.tag.ok::before{content:"✓ "}
.okmark{color:var(--ok);font-weight:700}
.log .deny{display:block;background:color-mix(in srgb,var(--danger) 14%,transparent);border-left:4px solid var(--danger);border-radius:6px;padding:6px 8px}
.log .conf{color:var(--ok);font-weight:700}
.rev{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rev .acts{display:flex;gap:6px}
.btn.okb{background:var(--ok)}.btn.nob{background:var(--danger)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.login{display:grid;gap:8px;margin-top:8px}
.login input{width:100%}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.85rem;padding:0}
.log .add{color:var(--ok);font-weight:700}.log .rm{color:var(--danger);font-weight:700}
.log time{color:var(--muted);font-size:.78rem;display:block}
.hint{color:var(--muted);font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px}
.del{background:none;border:0;color:var(--danger);cursor:pointer;font:inherit;font-size:.8rem}
@media (max-width:520px){.day{min-height:62px}.tag{font-size:.6rem;padding:0 3px}}
</style>

<div class="wrap">
  <header>
    <div class="top"><div class="brand"><img src="logo.png" alt="Escudo G.O.R. Ciudad Lineal" width="54" height="68"><div><h1>V.T.</h1><span class="tagline">Vacaciones del turno</span></div></div><button class="btn ghost" id="themeBtn" type="button"></button></div>
  </header>

  <div class="bar">
    <label for="who" style="font-weight:700">¿Quién eres?</label>
    <select id="who"><option value="">Todos (ver a todo el turno)</option></select>
    <span id="whoDot" style="width:14px;height:14px;border-radius:50%;display:inline-block" hidden></span>
    <label for="kind" style="font-weight:700">Tipo de día</label>
    <select id="kind"><option value="V26">Vacaciones 2026</option><option value="V27">Vacaciones 2027</option><option value="AP26">AP 2026</option><option value="AP27">AP 2027</option><option value="NAV">Navidad</option><option value="SS">Semana Santa</option><option value="OTRO">Otro</option></select>
    <span class="hint" id="status">Conectando…</span>
    <button class="linkbtn" id="adminBtn" type="button">Acceso responsables</button>
  </div>

  <div class="main">
    <section class="card">
      <div class="calhead">
        <button class="btn ghost" id="prev" aria-label="Mes anterior">‹</button>
        <h2 id="month"></h2>
        <button class="btn ghost" id="next" aria-label="Mes siguiente">›</button>
      </div>
      <div class="grid" id="cal"></div>
      <div class="legend"><span><i style="background:var(--tarde-bg);border:1px solid var(--tarde)"></i>Tarde</span><span><i style="background:var(--manana-bg);border:1px solid var(--manana)"></i>Mañana</span><span><i style="background:var(--libre-bg);border:1px solid var(--line)"></i>Libre</span></div>
    </section>
    <aside class="side">
      <section class="card" id="adminCard" hidden>
        <h2>Revisión de días</h2>
        <form class="login" id="loginForm" hidden>
          <input id="loginEmail" type="email" autocomplete="username" placeholder="Tu email" aria-label="Email">
          <input id="loginPass" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña">
          <button class="btn" type="submit">Entrar</button>
        </form>
        <div id="reviewBox" hidden>
          <p class="hint" style="margin:6px 0">Días pedidos pendientes de confirmar:</p>
          <div class="list" id="reviewList"></div>
          <p class="hint" style="margin:14px 0 6px">Decisiones recientes (por si te equivocas):</p>
          <div class="list" id="recentList"></div>
          <button class="linkbtn" id="logoutBtn" type="button" style="margin-top:10px">Cerrar sesión</button>
        </div>
      </section>
      <section class="card"><h2 id="sumTitle2026">Días pedidos 2026</h2><div id="summary2026" style="margin-top:8px"></div></section>
      <section class="card"><h2 id="sumTitle2027">Días pedidos 2027</h2><div id="summary2027" style="margin-top:8px"></div></section>
      <section class="card"><h2>Historial</h2><div class="list log" id="log" style="margin-top:8px"></div></section>
    </aside>
  </div>
</div>
<div class="confirm" id="confirmBar" hidden>
  <span id="pendText"></span>
  <button class="btn ghost" id="cancelBtn" type="button">Cancelar</button>
  <button class="btn" id="confirmBtn" type="button">Confirmar días</button>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const START = Date.UTC(2026,10,5); // 5 nov 2026, primer día de tardes
const COLORS = ["#c0392b","#2471a3","#1e8449","#8e44ad","#d35400","#117a65","#b7950b","#a93226","#5b2c6f","#1a5276","#7d6608","#943126"];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const pending = new Map(); // cambios sin confirmar: id -> {person,date,type|null}
const ADMINS = {"2iFYWcnlWEQAWwqRqxWOoICzVtm1":"Lara","nqUXnklNkIQseGfMZSoUAOS1hMy1":"Udyki"}; // responsables que confirman y deniegan
let confirmed = {}, admin = null;
const isOk = r => !!confirmed[r.id] && confirmed[r.id].reqAt===r.at;
let people = [], reqs = [], logs = [], sel = null, db = null;
let view = (()=>{const d=new Date();return d<new Date(2026,10,1)?{y:2026,m:10}:{y:d.getFullYear(),m:d.getMonth()}})();
try{ sel = localStorage.getItem("vt-sel"); }catch(e){}

function shift(y,m,d){
  const diff = Math.round((Date.UTC(y,m,d)-START)/864e5);
  const p = ((diff%24)+24)%24;
  return p<6?"T":p<12?"L":p<18?"M":"L";
}
const key = (y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const pName = id => (people.find(p=>p.id===id)||{}).name || "¿?";
const pColor = id => (people.find(p=>p.id===id)||{}).color || "#777";
const TYPES = {V26:"Vacaciones 2026",V27:"Vacaciones 2027",AP26:"AP 2026",AP27:"AP 2027",NAV:"Navidad",SS:"Semana Santa",OTRO:"Otro"};
const SHORT = {V26:"vac.",V27:"vac.",AP26:"AP",AP27:"AP",NAV:"Nav.",SS:"S. Santa",OTRO:"otro"};
const LABEL = {V26:"",V27:"V27",AP26:"AP",AP27:"AP27",NAV:"NAV",SS:"SS",OTRO:"OTRO"};
const norm = t => ({V:"V26",AP:"AP26"})[t] || t || "V26"; // los días antiguos (V/AP) son de 2026
const typeName = r => TYPES[norm(r.type)]||"Vacaciones 2026";
const yearOf = r => { const t=norm(r.type); if(t.endsWith("26"))return 2026; if(t.endsWith("27"))return 2027; const y=+r.date.slice(0,4); return t==="NAV"&&r.date.slice(5,7)==="01"?y-1:y; }; // la Navidad de enero cuenta para el año anterior
const tally = list => { const c={}; list.forEach(r=>{const t=norm(r.type);c[t]=(c[t]||0)+1;}); const s=Object.keys(TYPES).filter(t=>c[t]).map(t=>`${c[t]} ${SHORT[t]}`).join(" · "); return s||"0"; };
const fmt = k => { const [y,m,d]=k.split("-"); return `${+d} ${MONTHS[m-1].slice(0,3)} ${y}`; };
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200);}
function el(tag,attrs={},txt){const e=document.createElement(tag);Object.assign(e,attrs);if(txt!=null)e.textContent=txt;return e;}

function renderPeople(){
  const s=document.getElementById("who"), first=s.options[0]; s.replaceChildren(first);
  people.forEach(p=>s.append(el("option",{value:p.id},p.name)));
  s.value=sel||"";
  const dot=document.getElementById("whoDot"); dot.hidden=!sel; if(sel) dot.style.background=pColor(sel);
}
document.getElementById("who").onchange=e=>setSel(e.target.value||null);
function setSel(id){if(pending.size){pending.clear();toast("Cambios sin confirmar descartados");}sel=id;try{id?localStorage.setItem("vt-sel",id):localStorage.removeItem("vt-sel")}catch(e){}renderAll();}

function renderCal(){
  const {y,m}=view; document.getElementById("month").textContent=`${MONTHS[m]} ${y}`;
  const cal=document.getElementById("cal"); cal.replaceChildren();
  ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].forEach(d=>cal.append(el("div",{className:"dow"},d)));
  const off=(new Date(y,m,1).getDay()+6)%7, n=new Date(y,m+1,0).getDate();
  for(let i=0;i<off;i++) cal.append(el("div",{className:"day empty"}));
  const t=new Date(), tk=key(t.getFullYear(),t.getMonth(),t.getDate());
  for(let d=1;d<=n;d++){
    const s=shift(y,m,d), k=key(y,m,d), work=s!=="L";
    const cell=el(work?"button":"div",{className:`day ${s}${k===tk?" today":""}`});
    const head=el("div",{className:"dn"}); head.append(el("span",{},d),(()=>{const x=el("span",{className:"sh"});x.append(el("span",{className:"long"},s==="T"?"Tarde":s==="M"?"Mañana":"Libre"),el("span",{className:"short"},s));return x;})());
    cell.append(head);
    const here=reqs.filter(r=>r.date===k), tags=el("div",{className:"tags"});
    const pend=[...pending.values()].filter(q=>q.date===k);
    if(pend.length) cell.classList.add("haspend");
    here.filter(r=>!sel||r.person===sel).forEach(r=>{const q=pending.get(r.id);if(q&&q.type)return;const t=el("span",{className:"tag"+(q?" gone":"")+(isOk(r)?" ok":""),title:`${pName(r.person)} · ${typeName(r)}`},pName(r.person));t.dataset.l=LABEL[norm(r.type)];t.style.background=pColor(r.person);tags.append(t);});
    pend.filter(q=>q.type).forEach(q=>{const t=el("span",{className:"tag pend",title:`${pName(q.person)} · ${typeName(q)} (sin confirmar)`},pName(q.person));t.dataset.l=LABEL[norm(q.type)];t.style.background=pColor(q.person);tags.append(t);});
    cell.append(tags);
    if(sel&&here.length>1){const c=el("span",{className:"count",title:`${here.length} piden este día`},`${here.length}`);c.append(el("span",{className:"cl"}," piden"));cell.append(c);}
    if(work){cell.onclick=()=>toggle(k);cell.setAttribute("aria-label",`${d} ${MONTHS[m]}, ${s==="T"?"tarde":"mañana"}, ${here.length} peticiones`);}
    cal.append(cell);
  }
}

function renderSide(){
  [2026,2027].forEach(Y=>{
    const sum=document.getElementById("summary"+Y); sum.replaceChildren();
    const all=reqs.filter(r=>yearOf(r)===Y);
    if(sel){
      document.getElementById("sumTitle"+Y).textContent=`Días de ${pName(sel)} · ${Y}`;
      const mine=all.filter(r=>r.person===sel).sort((a,b)=>a.date.localeCompare(b.date));
      sum.append(el("div",{className:"stat"},`Total: ${mine.length} días (${tally(mine)})`));
      if(!mine.length) sum.append(el("p",{className:"hint"},`No tiene días pedidos de ${Y}.`));
      mine.forEach(r=>{const [YY,M,D]=r.date.split("-").map(Number);const row=el("div",{className:"stat"});row.append(el("span",{},`${fmt(r.date)} · ${shift(YY,M-1,D)==="T"?"tarde":"mañana"} · ${typeName(r)}`));if(isOk(r))row.firstChild.append(el("span",{className:"okmark"}," ✓ confirmado"));const x=el("button",{className:"del"},"Retirar");x.onclick=()=>removeReq(r);row.append(x);sum.append(row);});
    }else{
      document.getElementById("sumTitle"+Y).textContent=`Días pedidos ${Y}`;
      people.forEach(p=>{const row=el("div",{className:"stat"});const n=el("span");n.append(p.name);row.append(n,el("b",{},tally(all.filter(r=>r.person===p.id))));row.style.borderLeft=`4px solid ${p.color}`;row.style.paddingLeft="8px";sum.append(row);});
    }
  });
  const log=document.getElementById("log"); log.replaceChildren();
  const L=[...logs].sort((a,b)=>b.at-a.at).filter(l=>!sel||l.person===sel).slice(0,60);
  if(!L.length) log.append(el("p",{className:"hint"},"Aquí aparecerá quién pide o retira cada día."));
  const VERB={pide:"Pide ",cambia:"Cambia ",retira:"Retira ",confirma:"Confirmado ",deniega:"Denegado ",deshace:"Deshecho "};
  L.forEach(l=>{const d=el("div",{className:l.action==="deniega"?"deny":""});d.append(el("span",{className:l.action==="pide"?"add":l.action==="confirma"?"conf":"rm"},VERB[l.action]||"· "),document.createTextNode(`${pName(l.person)} · ${fmt(l.date)}${l.type?" · "+typeName(l):""}`),el("time",{},new Date(l.at).toLocaleString("es-ES")+(["confirma","deniega","deshace"].includes(l.action)?` · por ${ADMINS[l.by]||"Lara"}`:"")));log.append(d);});
  renderReview();
}
function renderAll(){renderPeople();renderCal();renderSide();}

let swipeLock=0;
function toggle(k){
  if(Date.now()-swipeLock<400) return;
  if(!sel){toast("Primero elige tu nombre en el desplegable");return;}
  const id=`${sel}_${k}`, cur=reqs.find(r=>r.id===id), type=document.getElementById("kind").value;
  const curType=cur?norm(cur.type):null, eff=pending.has(id)?pending.get(id).type:curType;
  const want=eff===type?null:type;
  if(want===curType) pending.delete(id); else pending.set(id,{person:sel,date:k,type:want});
  renderAll(); renderPending();
}
function removeReq(r){ pending.set(r.id,{person:r.person,date:r.date,type:null}); renderAll(); renderPending(); }
function renderPending(){
  const bar=document.getElementById("confirmBar"), n=pending.size;
  bar.hidden=!n; document.body.classList.toggle("pending",n>0);
  if(!n) return;
  const add=[...pending.values()].filter(q=>q.type).length;
  document.getElementById("pendText").textContent=`${n} cambio${n>1?"s":""} sin confirmar (${add} pedido${add===1?"":"s"}, ${n-add} retirado${n-add===1?"":"s"})`;
}
document.getElementById("cancelBtn").onclick=()=>{pending.clear();renderAll();renderPending();toast("Cambios descartados");};
document.getElementById("confirmBtn").onclick=async e=>{
  if(!db){toast("Sin conexión con los datos compartidos");return;}
  const btn=e.currentTarget; btn.disabled=true; btn.textContent="Guardando…";
  let okN=0;
  for(const [id,q] of [...pending]){
    const cur=reqs.find(r=>r.id===id);
    try{
      if(q.type){
        await db.doc(`requests/${id}`).set({person:q.person,date:q.date,type:q.type,at:Date.now()});
        await db.collection("log").doc().set({person:q.person,date:q.date,type:q.type,action:cur?"cambia":"pide",at:Date.now()});
      }else{
        await db.doc(`requests/${id}`).delete();
        await db.collection("log").doc().set({person:q.person,date:q.date,type:cur?norm(cur.type):"V26",action:"retira",at:Date.now()});
      }
      pending.delete(id); okN++;
    }catch(err){ toast("No se pudo guardar algún día: "+(err.message||err.code)); }
  }
  btn.disabled=false; btn.textContent="Confirmar días";
  renderAll(); renderPending();
  if(!pending.size) toast(`${okN} cambio${okN>1?"s":""} guardado${okN>1?"s":""}`);
};
window.addEventListener("beforeunload",e=>{if(pending.size){e.preventDefault();e.returnValue="";}});
function renderReview(){
  document.getElementById("loginForm").hidden=!!admin;
  document.getElementById("reviewBox").hidden=!admin;
  if(!admin) return;
  const box=document.getElementById("reviewList"); box.replaceChildren();
  const pend=reqs.filter(r=>!isOk(r)).sort((a,b)=>a.date.localeCompare(b.date)||pName(a.person).localeCompare(pName(b.person)));
  renderRecent();
  if(!pend.length){box.append(el("p",{className:"hint"},"No hay días pendientes de revisar."));return;}
  pend.forEach(r=>{
    const row=el("div",{className:"rev"}); row.append(el("span",{},`${pName(r.person)} · ${fmt(r.date)} · ${typeName(r)}`));
    const a=el("div",{className:"acts"}), ok=el("button",{className:"btn sm okb",type:"button"},"Confirmar"), no=el("button",{className:"btn sm nob",type:"button"},"Denegar");
    ok.onclick=()=>decide(r,true,ok); no.onclick=()=>decide(r,false,no); a.append(ok,no); row.append(a); box.append(row);
  });
}
function renderRecent(){
  const box=document.getElementById("recentList"); box.replaceChildren();
  const dec=logs.filter(l=>l.action==="confirma"||l.action==="deniega").sort((a,b)=>b.at-a.at).slice(0,30);
  if(!dec.length){box.append(el("p",{className:"hint"},"Aún no has confirmado ni denegado ningún día."));return;}
  dec.forEach(l=>{
    const id=`${l.person}_${l.date}`, r=reqs.find(x=>x.id===id);
    const undone=logs.some(u=>u.action==="deshace"&&u.person===l.person&&u.date===l.date&&u.at>l.at);
    const canUndo=!undone&&(l.action==="confirma"?(r&&isOk(r)):!r);
    const row=el("div",{className:"rev"});
    row.append(el("span",{},`${l.action==="confirma"?"✓":"✕"} ${pName(l.person)} · ${fmt(l.date)} · ${typeName(l)}`));
    if(canUndo){const b=el("button",{className:"btn sm ghost",type:"button"},"Deshacer");b.onclick=()=>undo(l,r,b);row.append(b);}
    else row.append(el("span",{className:"hint"},undone?"deshecho":"ya cambiado"));
    box.append(row);
  });
}
async function undo(l,r,btn){
  btn.disabled=true;
  try{
    if(l.action==="confirma") await db.doc(`confirmed/${r.id}`).delete();
    else await db.doc(`requests/${l.person}_${l.date}`).set({person:l.person,date:l.date,type:norm(l.type),at:Date.now()});
    await db.collection("log").doc().set({person:l.person,date:l.date,type:norm(l.type),action:"deshace",by:admin.uid,at:Date.now()});
    toast(l.action==="confirma"?`Confirmación deshecha: ${pName(l.person)} vuelve a estar pendiente`:`Denegación deshecha: el día de ${pName(l.person)} vuelve al calendario`);
  }catch(e){btn.disabled=false;toast("No se pudo deshacer: "+(e.code||e.message));}
}
async function decide(r,yes,btn){
  if(!yes&&btn.dataset.armed!=="1"){btn.dataset.armed="1";btn.textContent="¿Seguro?";setTimeout(()=>{btn.dataset.armed="";btn.textContent="Denegar";},3000);return;}
  btn.disabled=true;
  try{
    if(yes){ await db.doc(`confirmed/${r.id}`).set({reqAt:r.at,at:Date.now()}); }
    else{ await db.doc(`requests/${r.id}`).delete(); if(confirmed[r.id]) await db.doc(`confirmed/${r.id}`).delete(); }
    await db.collection("log").doc().set({person:r.person,date:r.date,type:norm(r.type),action:yes?"confirma":"deniega",by:admin.uid,at:Date.now()});
    toast(yes?`Confirmado: ${pName(r.person)} ${fmt(r.date)}`:`Denegado: ${pName(r.person)} ${fmt(r.date)}`);
  }catch(e){btn.disabled=false;toast("No tienes permiso o no se pudo guardar: "+(e.code||e.message));}
}
document.getElementById("adminBtn").onclick=()=>{const c=document.getElementById("adminCard");c.hidden=!c.hidden;renderReview();if(!c.hidden)c.scrollIntoView({behavior:"smooth"});};
document.getElementById("loginForm").onsubmit=async e=>{
  e.preventDefault();
  try{ await firebase.auth().signInWithEmailAndPassword(document.getElementById("loginEmail").value.trim(),document.getElementById("loginPass").value); document.getElementById("loginPass").value=""; }
  catch(err){ toast("Email o contraseña incorrectos"); }
};
document.getElementById("logoutBtn").onclick=()=>firebase.auth().signOut();
(()=>{ // deslizar con el dedo sobre el calendario para cambiar de mes
  const cal=document.getElementById("cal"); let x0=null,y0=null;
  cal.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
  cal.addEventListener("touchend",e=>{
    if(x0===null) return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5) return;
    swipeLock=Date.now(); document.getElementById(dx<0?"next":"prev").click();
    cal.animate([{transform:`translateX(${dx<0?40:-40}px)`,opacity:.3},{transform:"none",opacity:1}],{duration:220,easing:"ease-out"});
  },{passive:true});
})();
document.getElementById("prev").onclick=()=>{view.m--;if(view.m<0){view.m=11;view.y--}renderCal();};
document.getElementById("next").onclick=()=>{view.m++;if(view.m>11){view.m=0;view.y++}renderCal();};
renderAll();

people = [["lara","Lara"],["udyki","Udyki"],["jaime","Jaime"],["juanjo","Juanjo"],["carmen","Carmen"],["laura","Laura"],["soledad","Soledad"],["jorge","Jorge"],["valdi","Valdi"],["antonio","Antonio"],["guillermo","Guillermo"],["alvaro","Álvaro"]]
  .map(([id,name],i)=>({id,name,color:COLORS[i%COLORS.length]}));

(()=>{
  const st=document.getElementById("status");
  try{ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); }
  catch(e){ st.textContent="No se pudo conectar: "+e.message; return; }
  const timer=setTimeout(()=>st.textContent="Tardando en cargar… revisa tu conexión",10000);
  const map=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  const ok=()=>{clearTimeout(timer);st.textContent="Sincronizado en tiempo real";};
  const err=e=>{clearTimeout(timer);st.textContent="Error al cargar: "+(e.message||e.code);};
  db.collection("requests").onSnapshot(s=>{reqs=map(s);ok();renderAll();},err);
  db.collection("log").onSnapshot(s=>{logs=map(s);renderSide();},err);
  db.collection("confirmed").onSnapshot(s=>{confirmed={};s.docs.forEach(d=>confirmed[d.id]=d.data());renderAll();},err);
  firebase.auth().onAuthStateChanged(u=>{admin=u;if(u)document.getElementById("adminCard").hidden=false;document.getElementById("adminBtn").textContent=u?`Revisión (${ADMINS[u.uid]||"responsable"})`:"Acceso responsables";renderReview();});
})();
const themeBtn=document.getElementById("themeBtn");
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;};
const paintTheme=()=>{const d=isDark();themeBtn.replaceChildren(el("span",{},d?"☀️":"🌙"),el("span",{className:"tl"},d?" Modo claro":" Modo oscuro"));themeBtn.setAttribute("aria-label",d?"Modo claro":"Modo oscuro");document.querySelector('meta[name="theme-color"]').content=d?"#0b1222":"#0e1b33";};
themeBtn.onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("vt-theme",t)}catch(e){}paintTheme();};
paintTheme();
